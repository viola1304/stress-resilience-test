<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stress–Resilience Index 測驗</title>
<style>
:root {
  --primary: #5f7f8a;
  --primary-dark: #4a666f;
  --secondary: #c9b8a3;
  --bg: #f6f7f6;
  --card: #ffffff;
  --text-main: #2f3a3d;
  --text-sub: #6b7280;
  --divider: #e5e7eb;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
  background: var(--bg);
  margin: 0;
  padding: 20px 12px;
  color: var(--text-main);
}
.container {
  max-width: 720px;
  margin: auto;
  background: var(--card);
  border-radius: 16px;
  padding: 28px 20px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.05);
}
h1 { font-size: 1.6rem; margin-bottom: 6px; color: var(--primary-dark); }
.subtitle { color: var(--text-sub); margin-bottom: 28px; line-height: 1.6; font-size: 1rem; }
.question { margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--divider); }
.question:last-child { border-bottom: none; }
.question p { margin-bottom: 12px; font-size: 1.05rem; line-height: 1.6; }
.scale { display: flex; justify-content: space-between; gap: 4px; }
.scale label { flex: 1; text-align: center; font-size: 0.85rem; color: var(--text-sub); }
button { width: 100%; padding: 16px; font-size: 1rem; border: none; border-radius: 12px; background: var(--primary); color: white; cursor: pointer; margin-top: 12px; }
button:hover { background: var(--primary-dark); }
.result { margin-top: 32px; padding: 20px; background: #f9fafb; border-radius: 14px; display: none; }
.type { font-size: 1.3rem; font-weight: 600; margin-bottom: 8px; color: var(--primary-dark); }
</style>
</head>
<body>
<div class="container">
  <h1>Stress–Resilience Index 測驗</h1>
  <div class="subtitle">2 分鐘了解你在壓力下是如何運作的<br><span style="font-size:0.9rem; color:#6b7280;">作答方式：1–5 分（1 = 非常不同意｜5 = 非常同意）</span></div>

  <div id="questions"></div>
  <button onclick="calculateResult()">送出測驗</button>
  <div class="result" id="result">
    <div class="type" id="type"></div>
    <div id="tagline" style="margin-bottom:12px; font-size:1rem; color:#4b5563;"></div>
    <div id="desc" style="font-size:0.95rem; color:#2f3a3d;"></div>
    <button style="margin-top:10px; background:#cbd5e1; color:#1f2937;" onclick="navigator.clipboard.writeText('我的壓力－復原力型態是【'+type+'】｜'+tagline); alert('已複製，可貼上分享');">分享我的型態</button>
  </div>
</div>
<script>
const questionsData = [
  "我能夠在壓力下維持冷靜。",
  "我會尋求朋友或家人的支持。",
  "即使遇到困難，我仍保持積極態度。",
  "我在壓力下容易疲倦或焦躁。",
  "我能迅速從挫折中恢復。",
  "我覺得自己有能力應對生活中的挑戰。",
  "壓力常讓我無法專心工作或學習。",
  "我知道如何安排休息和調節心情。",
  "我對未來保持希望和樂觀。",
  "我感到自己在壓力下容易耗盡精力。",
  "我有策略來管理壓力和情緒。",
  "我能夠維持身心健康，即使面對挑戰。"
];
const questionsDiv = document.getElementById('questions');
questionsData.forEach((q,i)=>{
  const div = document.createElement('div');
  div.className='question';
  div.innerHTML=`<p>題目 ${i+1}: ${q}</p>
  <div class='scale'>
    <label>1</label><label>2</label><label>3</label><label>4</label><label>5</label>
  </div>`;
  questionsDiv.appendChild(div);
});

function calculateResult(){
  let stress=0,resilience=0;
  document.querySelectorAll('.question').forEach((q,i)=>{
    let val=3;
    if(i%2===0) stress+=val; else resilience+=val;
  });
  let type='',desc='',tagline='';
  if(stress>=21 && resilience>=21){type='耐震推進型';desc='你能在高壓下維持運作，但需要留意長期耗損。';tagline='你不是沒有極限，而是習慣把極限往後放。';}
  else if(stress>=21 && resilience<21){type='過載燃燒型';desc='你正承受高壓且恢復較慢，最需要優先照顧自己。';tagline='你不是撐不住，而是撐太久了。';}
  else if(stress<21 && resilience>=21){type='彈性穩定型';desc='你目前狀態平衡，具備良好的調節能力。';tagline='你知道如何在前進與休息之間切換。';}
  else{type='潛在耗損型';desc='壓力不高，但緩衝較少，需提早建立復原機制。';tagline='你需要的不是更努力，而是更多緩衝。';}
  document.getElementById('type').innerText=type;
  document.getElementById('tagline').innerText=tagline;
  document.getElementById('desc').innerText=desc;
  document.getElementById('result').style.display='block';
}
</script>
</body>
</html>
